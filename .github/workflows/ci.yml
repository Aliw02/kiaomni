name: CI

on:
  push:
    branches: [main, exp/kiaomni-moe-model-lab, exp/kiaomni-qwen3-30b-modal-scale-gate, exp/kiaomni-qwen3-30b-adjudication-routing-v1, exp/kiaomni-qwen3-practical-budget-frontier-v1]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]
          pip install "modal==1.6.0"
      - name: Run pure-numpy + mocked-probe tests (no model download)
        run: pytest tests/test_utils.py tests/test_policies.py tests/test_probe_mocked.py tests/test_hybrid_probe.py tests/test_moe_stability.py tests/test_saliency_strategy.py tests/test_remove_regression.py tests/test_moe_phase02_benchmark.py tests/test_blocksal.py tests/test_mobilemoe_snapkv_adapter.py tests/test_qwen3_scale_gate.py tests/test_phase03_qwen3_modal_gate.py tests/test_phase03_adjudication_routing.py tests/test_phase03_percentage_replay.py tests/test_phase03_ruler_niah.py -v
      - name: Cache Hugging Face hub (gpt2 weights)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-hub-gpt2-${{ runner.os }}-v1
      - name: Run GPT-2 smoke test (downloads ~500MB on cache miss)
        env:
          # Authenticated Hub requests get much higher rate limits than the
          # anonymous shared-IP pool of GitHub runners. Empty if the secret
          # is not configured — the test then skips on a 429 instead of
          # failing (see tests/test_gpt2_smoke.py).
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: pytest tests/test_gpt2_smoke.py -v


  modal-windows-import:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install Phase-03 validation dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install "modal==1.6.0"
      - name: Validate Phase-03 launcher on Windows
        run: pytest tests/test_qwen3_scale_gate.py tests/test_phase03_qwen3_modal_gate.py tests/test_phase03_adjudication_routing.py tests/test_phase03_percentage_replay.py tests/test_phase03_ruler_niah.py -v
